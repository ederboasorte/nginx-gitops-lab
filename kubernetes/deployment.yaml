apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gitops-lab
  namespace: nginx-gitops
  labels:
    app: nginx-gitops-lab
spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-gitops-lab

  template:
    metadata:
      labels:
        app: nginx-gitops-lab

    spec:
      containers:
        - name: nginx
          image: ederhub/nginx-gitops-lab:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

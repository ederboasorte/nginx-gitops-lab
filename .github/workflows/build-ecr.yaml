name: Build ECR and Update GitOps

on:
  push:
    branches:
      - main

    paths-ignore:
      - "k8s/**"
      - "argocd/**"
      - "terraform-github-oidc/**"
      - "**/*.md"

  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: nginx-gitops-lab
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build:
    name: Build and push NGINX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exibir claims OIDC
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl --fail --silent --show-error \
           -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
           "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

         TOKEN=$(echo "$RESPONSE" | jq -r '.value')
         PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

         case $((${#PAYLOAD} % 4)) in
           2) PAYLOAD="${PAYLOAD}==" ;;
           3) PAYLOAD="${PAYLOAD}=" ;;
         esac

         echo "$PAYLOAD" |
           tr '_-' '/+' |
           base64 -d |
           jq '{iss, aud, sub, repository, repository_id, repository_owner, repository_owner_id, ref}'

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: nginx-gitops-lab

      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Definir imagem
        id: image
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}"

          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          echo "Imagem: ${IMAGE_URI}:${IMAGE_TAG}"

      - name: Build
        run: |
          docker build \
            --tag "${{ steps.image.outputs.uri }}:${{ steps.image.outputs.tag }}" \
            .

      - name: Push para o ECR
        run: |
          docker push \
            "${{ steps.image.outputs.uri }}:${{ steps.image.outputs.tag }}"

      - name: Atualizar Kustomize
        shell: bash
        run: |
          sed -i \
            "s|newName:.*|newName: ${{ steps.image.outputs.uri }}|" \
            k8s/kustomization.yaml

          sed -i \
            "s|newTag:.*|newTag: ${{ steps.image.outputs.tag }}|" \
            k8s/kustomization.yaml

          cat k8s/kustomization.yaml

      - name: Commit da nova versão
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/kustomization.yaml

          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
            exit 0
          fi

          git commit \
            -m "chore(gitops): deploy ${{ steps.image.outputs.tag }}"

          git push

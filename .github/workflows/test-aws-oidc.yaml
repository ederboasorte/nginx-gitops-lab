name: Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Exibir contexto
        run: |
          echo "Repository=$GITHUB_REPOSITORY"
          echo "Ref=$GITHUB_REF"
          echo "Event=$GITHUB_EVENT_NAME"

      - name: Exibir claims do token OIDC
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" |
            tr '_-' '/+' |
            base64 -d |
            jq '{iss, aud, sub, repository, ref, event_name, environment}'

      - name: Assumir role AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::451638006344:role/nginx-gitops-lab-github-actions
          aws-region: us-east-1
          audience: sts.amazonaws.com
          retry-max-attempts: 2

      - name: Confirmar identidade
        run: aws sts get-caller-identity

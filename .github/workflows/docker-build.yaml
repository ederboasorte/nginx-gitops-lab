name: Docker Build, Push and Update Manifest

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Definir tag da imagem
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ederhub/nginx-gitops-lab" >> "$GITHUB_ENV"

      - name: Build da imagem Docker
        run: |
          docker build \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            --tag "${IMAGE_NAME}:latest" \
            .

      - name: Push da imagem para o Docker Hub
        run: |
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:latest"

      - name: Atualizar imagem no Deployment
        run: |
          sed -i \
            "s|image: ederhub/nginx-gitops-lab:.*|image: ${IMAGE_NAME}:${IMAGE_TAG}|" \
            kubernetes/deployment.yaml

          echo "Imagem configurada no manifesto:"
          grep "image:" kubernetes/deployment.yaml

      - name: Commit da nova versão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/deployment.yaml

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no manifesto."
            exit 0
          fi

          git commit -m "deploy: atualiza imagem para ${IMAGE_TAG} [skip ci]"
          git push

name: Eder - Docker Build and Push

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Eder - Build Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Eder - Checkout do código
        uses: actions/checkout@v4

      - name: Eder - Login no Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Eder - Build da imagem
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/nginx-gitops-lab:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/nginx-gitops-lab:latest \
            .

      - name: Eder - Push da imagem
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/nginx-gitops-lab:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/nginx-gitops-lab:latest

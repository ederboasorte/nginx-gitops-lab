name: Debug OIDC Token

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar contexto
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Ref name: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Obter e exibir claims OIDC
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" \
            | cut -d '.' -f2 \
            | tr '_-' '/+' \
            | awk '{l=length($0)%4; if(l==2)$0=$0"=="; else if(l==3)$0=$0"="; print}' \
            | base64 -d)

          echo "$PAYLOAD" | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_owner,
            ref,
            ref_type,
            event_name,
            environment,
            job_workflow_ref
          }'

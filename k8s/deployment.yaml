apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gitops-lab
  labels:
    app: nginx-gitops-lab

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-gitops-lab

  template:
    metadata:
      labels:
        app: nginx-gitops-lab

    spec:
      automountServiceAccountToken: false

      containers:
        - name: nginx
          image: NGINX_GITOPS_IMAGE
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 200m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101

            capabilities:
              drop:
                - ALL

      securityContext:
        seccompProfile:
          type: RuntimeDefault
